<!-- BOOK SERVICE -->
<section class="section booking" id="booking">

    <div class="section-title">
        <h2 style="color:white;">Book an Agriculture Service</h2>
        <p style="color:#dcebdd;">
            Request support from Farm Ease
        </p>
    </div>

    <div class="booking-container">

        <form class="form">

            <div class="form-group">
                <label>Farmer Name</label>
                <input type="text"
                       id="farmerName"
                       placeholder="Enter your name"
                       required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel"
                       placeholder="Enter mobile number"
                       required>
            </div>

            <div class="form-group">
                <label>Service</label>

                <select id="service" required>
                    <option value="">Select Service</option>
                    <option>Crop Advisory</option>
                    <option>Soil Testing</option>
                    <option>Irrigation Service</option>
                    <option>Farm Equipment</option>
                    <option>Pest Control</option>
                    <option>Expert Consultation</option>
                </select>
            </div>

            <div class="form-group">
                <label>Farm Location</label>
                <input type="text" placeholder="Village / City" required>
            </div>

            <div class="form-group full">
                <label>Message</label>
                <textarea rows="4" placeholder="Describe your requirement"></textarea>
            </div>

            <div class="form-group full">
                <button class="btn btn-primary" type="submit">
                    Submit Service Request
                </button>
            </div>

        </form>

    </div>
</section>

</body>
